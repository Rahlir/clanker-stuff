# finances.toml - configuration for the `finances` hledger skill.
#
# Copy this file beside your LEDGER_FILE and customize it, e.g.:
#   cp finances.example.toml "$(dirname "$LEDGER_FILE")/finances.toml"
#
# The journal path itself is NOT configured here: it comes from $LEDGER_FILE.
# This file only holds reporting defaults the skill applies on top of it.

[valuation]
# Commodity that "how much / what's it worth" answers should be reported in.
base_currency = "CZK"

# Passed to hledger as `--value=<default_value>` for valued reports.
# Common choices: "end,CZK" (period-end prices), "now,CZK", "then,CZK".
default_value = "end,CZK"

# Pass `--infer-market-prices` so hledger can derive prices from transactions
# in addition to explicit `P` directives. Set false to use only `P` directives.
infer_market_prices = true

[prices]
# Commodities whose `P` prices the stale-price guard should check before any
# valued report. List the foreign currencies and securities you actually hold.
commodities = ["USD", "EUR", "VUG", "SHA", "T", "NVDA", "MRVI"]

# A valued report is flagged as possibly outdated if the newest `P` price for
# any monitored commodity is older than this many days.
stale_after_days = 7

[prices.sources]
# Where scripts/update-prices.py fetches each commodity's quote (Yahoo Finance
# tickers). This may be a SUBSET of `commodities` above: anything without an
# entry here is simply not auto-fetched and stays manually priced (the stale
# guard will keep warning about it, which is correct).
# `quote` is the currency the ticker is denominated in; the script refuses to
# print a price if the API disagrees, which catches ticker changes/delistings.
USD  = { ticker = "USDCZK=X", quote = "CZK" }
EUR  = { ticker = "EURCZK=X", quote = "CZK" }
VUG  = { ticker = "VUG",      quote = "USD" }
T    = { ticker = "T",        quote = "USD" }
NVDA = { ticker = "NVDA",     quote = "USD" }
MRVI = { ticker = "MRVI",     quote = "USD" }
# SHA: no source entry for now - Schaeffler's ticker changed after their 2024
# share restructuring (SHA.DE -> SHA0.DE); re-add once you want it auto-fetched.

[import]
# Paths are relative to the directory of LEDGER_FILE. inbox and archive being
# nested inside the staging directory is intentional (one import/ tree); raw
# downloads in inbox/ are not stale staging files - never "clean them up".
inbox = "import/inbox"        # drop raw bank downloads here
staging = "import"            # staging CSVs + <name>.csv.rules live here
archive = "import/archive"    # raws move to <archive>/YYYY-MM/ after import
# Per-source import journals: hledger import appends to <journals>/<name>.journal
# (each included from the main journal), never to the main journal itself -
# `hledger check ordereddates` is per-file, and statement periods overlap.
journals = "journal"
# Reserved sentinel accounts that per-account rules use as catch-alls;
# transactions landing here are treated as "unknown payee" during the
# categorization loop. No rule may assign these deliberately - a genuine
# miscellaneous category must be a different account (e.g. Expenses:Misc),
# or "lands in a fallback account" stops meaning "unknown".
fallback_accounts = ["Expenses:Unknown", "Income:Unknown"]

# One entry per statement source. The table key is the staging name:
# staging file <staging>/<name>.csv, rules <staging>/<name>.csv.rules.

[import.accounts.checking]
match = "12-3456789"            # regex tried against filename + file head
account = "Assets:Checking"
format = "csv"
encoding = "windows-1250"       # only if clean-csv.py auto-detect needs help
decimal_comma = true            # export uses comma decimals but the journal
                                # style is dot-based: stage with
                                # clean-csv.py --decimal-comma (import.md)

[import.accounts.card]
match = "VÝPIS Z ÚČTU KE KREDITNÍ KARTĚ"
account = "Liabilities:Card"
format = "pdf-statement"        # PDF with opening/closing balances

[import.accounts.revolut-czk]
match = "account-statement.*czk"
account = "Assets:Revolut"
format = "csv"                  # per-currency export: one entry per currency
