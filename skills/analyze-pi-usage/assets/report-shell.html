<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="<!--slot:csp-->">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title><!--slot:title--></title>
<script>
  // Pick the theme before first paint: the reader's last choice, else the OS.
  (function () {
    var t = localStorage.getItem("pi-report-theme");
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
/* ===================================================================
   Palettes. Every text color meets its contrast target on --page,
   --surface and --raised (checked by scripts/lib/contrast.test.mjs):
   ink >= 10:1, ink-2 >= 7:1, ink-3 >= 4.5:1, accent text >= 5:1,
   chart fills >= 3:1 against --surface.
   =================================================================== */
:root[data-theme="dark"] {
  --page: #171d20;
  --surface: #1f272b;
  --raised: #283236;
  --sunken: #12171a;
  --rule: #313d42;
  --rule-strong: #46545a;

  --ink-strong: #f7f0de;
  --ink: #ece4cf;
  --ink-2: #c3c9b9;
  --ink-3: #9aa59b;

  --green: #b6d18c;
  --aqua: #8ed3aa;
  --blue: #90c8d2;
  --yellow: #ecc98a;
  --orange: #f2a681;
  --red: #f69c9e;
  --purple: #e4a8ca;

  --green-soft: rgba(167, 196, 122, 0.13);
  --aqua-soft: rgba(124, 196, 153, 0.13);
  --blue-soft: rgba(111, 179, 196, 0.13);
  --yellow-soft: rgba(226, 185, 100, 0.13);
  --orange-soft: rgba(230, 152, 117, 0.14);
  --red-soft: rgba(229, 127, 131, 0.14);
  --purple-soft: rgba(207, 147, 180, 0.13);

  /* You are magenta and the agent blue everywhere: warm hues mean caution
     (friction, risk) on this page, so they never encode a person. */
  --c-you: #d98cbd;
  --c-agent: #6fb3c4;
  --c-main: #a7c47a;
  --c-reviews: #a7a3e0;
  --c-other: #8f9c94;
  --c-heat: #a7c47a;
  --k1: #a7c47a;
  --k2: #6fb3c4;
  --k3: #e69875;
  --k4: #cf93b4;
  --k5: #7cc499;
  --k6: #e2b964;
  --k7: #e57f83;
  --k8: #8f9c94;

  --focus: #ecc98a;
  --topo: #8ed3aa;
  --topo-opacity: 0.11;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 12px 32px -18px rgba(0, 0, 0, 0.7);
  --glow: radial-gradient(1200px 520px at 78% -10%, rgba(142, 211, 170, 0.09), transparent 60%),
    radial-gradient(900px 480px at 8% 0%, rgba(236, 201, 138, 0.06), transparent 65%);
}

:root[data-theme="light"] {
  --page: #f5f0e2;
  --surface: #fffcf2;
  --raised: #efe8d6;
  --sunken: #ebe4d1;
  --rule: #ddd5c0;
  --rule-strong: #c4baa1;

  --ink-strong: #141b1e;
  --ink: #232c30;
  --ink-2: #3f4a4f;
  --ink-3: #5f6b66;

  --green: #4f6500;
  --aqua: #146a4a;
  --blue: #1b6488;
  --yellow: #7c5c00;
  --orange: #a14708;
  --red: #b42a2c;
  --purple: #953679;

  --green-soft: rgba(108, 138, 0, 0.1);
  --aqua-soft: rgba(46, 154, 110, 0.1);
  --blue-soft: rgba(47, 134, 163, 0.1);
  --yellow-soft: rgba(184, 134, 15, 0.12);
  --orange-soft: rgba(200, 100, 28, 0.1);
  --red-soft: rgba(208, 69, 63, 0.1);
  --purple-soft: rgba(176, 80, 143, 0.1);

  --c-you: #b2418e;
  --c-agent: #2f86a3;
  --c-main: #6c8a00;
  --c-reviews: #6660b8;
  --c-other: #7d8a83;
  --c-heat: #4f7a00;
  --k1: #6c8a00;
  --k2: #2f86a3;
  --k3: #c8641c;
  --k4: #b0508f;
  --k5: #2e9a6e;
  --k6: #b8860f;
  --k7: #d0453f;
  --k8: #7d8a83;

  --focus: #1b6488;
  --topo: #3d6b4f;
  --topo-opacity: 0.13;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.6) inset, 0 10px 28px -20px rgba(60, 50, 20, 0.35);
  --glow: radial-gradient(1200px 520px at 78% -10%, rgba(46, 154, 110, 0.08), transparent 60%),
    radial-gradient(900px 480px at 8% 0%, rgba(184, 134, 15, 0.07), transparent 65%);
}

/* ===================================================================
   Type and base
   =================================================================== */
:root {
  --font-prose: "Iowan Old Style", "Charter", "Bitstream Charter", "Palatino Linotype", Palatino, ui-serif, Georgia, serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --measure: 70ch;
  --radius: 10px;
  --rail: 248px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 24px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 18px/1.62 var(--font-prose);
  font-variant-numeric: oldstyle-nums proportional-nums;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

::selection { background: var(--yellow-soft); color: var(--ink-strong); }
a { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--aqua); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 4px; }

code, kbd, samp, pre { font-family: var(--font-mono); font-size: 0.82em; font-variant-numeric: normal; }
:not(pre) > code {
  background: var(--raised);
  color: var(--ink);
  padding: 0.12em 0.4em;
  border-radius: 5px;
  border: 1px solid var(--rule);
}
kbd {
  background: var(--surface);
  border: 1px solid var(--rule-strong);
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 0.05em 0.4em;
}
pre {
  background: var(--sunken);
  color: var(--ink);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 14px 16px;
  overflow-x: auto;
  line-height: 1.55;
}

.skip { position: absolute; left: -999px; top: 8px; background: var(--surface); color: var(--ink); padding: 8px 12px; z-index: 10; }
.skip:focus { left: 8px; }

/* ===================================================================
   Frame: a sticky rail of sections beside the main column
   =================================================================== */
.frame {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  min-height: 100vh;
  background: var(--glow);
  background-repeat: no-repeat;
}

.rail {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 28px;
  padding: 34px 22px 26px 30px;
  border-right: 1px solid var(--rule);
  font-family: var(--font-mono);
}

.brand { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 12.5px; letter-spacing: 0.14em; text-transform: uppercase; }
.brand-mark {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--green-soft);
  color: var(--green);
  font: 600 18px/1 var(--font-prose);
  letter-spacing: 0;
  text-transform: none;
  border: 1px solid var(--rule-strong);
}

.toc { display: flex; flex-direction: column; gap: 2px; counter-reset: toc; }
.toc a {
  display: grid;
  grid-template-columns: 30px 1fr;
  align-items: baseline;
  padding: 7px 10px;
  margin-left: -10px;
  border-radius: 7px;
  color: var(--ink-2);
  text-decoration: none;
  font-size: 13.5px;
  line-height: 1.35;
  border-left: 2px solid transparent;
}
.toc a .n { color: var(--ink-3); font-size: 11.5px; }
.toc a:hover { background: var(--surface); color: var(--ink-strong); }
.toc a[aria-current="true"] { background: var(--surface); color: var(--ink-strong); border-left-color: var(--green); }
.toc a[aria-current="true"] .n { color: var(--green); }

.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
.theme-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  align-self: flex-start;
  background: var(--surface);
  color: var(--ink-2);
  border: 1px solid var(--rule-strong);
  border-radius: 999px;
  padding: 6px 13px 6px 10px;
  font: 12.5px/1 var(--font-mono);
  letter-spacing: 0.04em;
  cursor: pointer;
}
.theme-toggle:hover { color: var(--ink-strong); border-color: var(--ink-3); }
.theme-toggle .glyph { width: 14px; height: 14px; fill: currentColor; }
.rail-note { color: var(--ink-3); font-size: 11.5px; line-height: 1.5; }

main { min-width: 0; padding: 0 clamp(20px, 5vw, 72px) 64px; }
.column { max-width: 1060px; margin: 0 auto; }

/* ===================================================================
   Hero
   =================================================================== */
.hero { position: relative; padding: 76px 0 42px; isolation: isolate; container-type: inline-size; }
.topo-wrap {
  position: absolute;
  inset: 0 calc(-1 * clamp(20px, 5vw, 72px)) auto;
  height: 560px;
  z-index: -1;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, #000 30%, transparent 96%);
  mask-image: linear-gradient(to bottom, #000 30%, transparent 96%);
}
.topo { width: 100%; height: 100%; fill: none; stroke: var(--topo); stroke-width: 1; opacity: var(--topo-opacity); }
.topo path.index { stroke-width: 1.8; }

main .kicker {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 0;
  max-width: none;
  margin: 0 0 22px;
  font: 12.5px/1.4 var(--font-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.kicker span:first-child { color: var(--green); }
.kicker span + span::before { content: "/"; margin: 0 12px; color: var(--ink-3); }

.hero h1 {
  max-width: 19ch;
  margin: 0 0 22px;
  color: var(--ink-strong);
  font: 600 clamp(2.5rem, 5.2vw, 4.1rem)/1.04 var(--font-prose);
  letter-spacing: -0.015em;
  text-wrap: balance;
}
.hero h1 em { font-style: italic; font-weight: 600; color: var(--green); }
.lede { max-width: 62ch; margin: 0 0 36px; font-size: 1.2rem; line-height: 1.6; color: var(--ink); }

/* KPI cards rendered from facts; one row when there is room, then 3, then 2 */
.kpis { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 12px; }
@container (max-width: 940px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@container (max-width: 560px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi {
  --tone: var(--c-agent);
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 17px 16px 12px;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.kpi::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--tone); opacity: 0.9; }
.kpi.t-sessions { --tone: var(--c-other); }
.kpi.t-you { --tone: var(--c-you); }
.kpi.t-agent { --tone: var(--c-agent); }
.kpi.t-spend { --tone: var(--c-main); }
.kpi.t-prompts { --tone: var(--c-you); }
.kpi.t-outcomes { --tone: var(--k5); }
.kpi-value { font: 600 1.85rem/1.1 var(--font-mono); color: var(--ink-strong); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kpi-label { font: 11.5px/1.3 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
.kpi-sub { font: 12px/1.45 var(--font-mono); color: var(--ink-3); min-height: 2.9em; }
.delta { white-space: nowrap; color: var(--ink-2); }
.spark { width: 100%; height: 26px; margin-top: auto; fill: var(--tone); opacity: 0.85; }

/* ===================================================================
   Sections
   =================================================================== */
main section { padding: 56px 0 8px; border-top: 1px solid var(--rule); }
main section:first-of-type { border-top: 0; }
.eyebrow {
  display: flex;
  gap: 12px;
  align-items: baseline;
  margin: 0 0 12px;
  font: 12.5px/1 var(--font-mono);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--green);
}
.eyebrow .num { color: var(--ink-3); }
main h2 {
  max-width: 28ch;
  margin: 0 0 14px;
  color: var(--ink-strong);
  font: 600 clamp(1.7rem, 3vw, 2.35rem)/1.12 var(--font-prose);
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.dek { max-width: var(--measure); margin: 0 0 30px; font-size: 1.12rem; color: var(--ink-2); }
main h3 { margin: 34px 0 10px; color: var(--ink-strong); font: 600 1.25rem/1.3 var(--font-prose); }
main p, main li { max-width: var(--measure); }
main p { margin: 0 0 16px; }
strong { color: var(--ink-strong); font-weight: 600; }
.mono { font-family: var(--font-mono); font-size: 0.86em; }
.muted { color: var(--ink-2); }

.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.grid-2 > *, .grid-3 > * { min-width: 0; }

/* ===================================================================
   Charts
   =================================================================== */
main { counter-reset: fig; }
.chart {
  overflow-x: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--rule-strong) transparent;
  margin: 0 0 16px;
  padding: 18px 20px 14px;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  counter-increment: fig;
}
.chart figcaption { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 0 0 12px; }
.fig-num::before { content: "fig " counter(fig, decimal-leading-zero); font: 11.5px/1 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.fig-title { font: 600 1.06rem/1.3 var(--font-prose); color: var(--ink-strong); }
.fig-note { font: 12.5px/1.4 var(--font-mono); color: var(--ink-2); }
.fig-more { margin: 4px 0 0; font: 12px/1.4 var(--font-mono); color: var(--ink-3); }

/* Below ~540px the chart scrolls sideways instead of shrinking its labels. */
.viz { display: block; width: 100%; min-width: 540px; height: auto; overflow: visible; font-family: var(--font-mono); }
.viz .axis { font-size: 10.5px; fill: var(--ink-3); }
.viz .value { font-size: 11.5px; fill: var(--ink-2); font-variant-numeric: tabular-nums; }
.viz .grid { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 2 4; }
.viz .baseline { stroke: var(--rule-strong); stroke-width: 1; }
.viz .shade { fill: var(--raised); opacity: 0.55; }
.viz .hit { fill: transparent; }
.viz .col:hover rect:not(.hit) { filter: brightness(1.12); }

/* Ranked bars (HTML, so labels keep their size in narrow columns) */
.bars {
  display: grid;
  grid-template-columns: minmax(0, max-content) minmax(70px, 1fr) max-content;
  align-items: center;
  gap: 10px 14px;
  font-family: var(--font-mono);
}
.bar-label {
  max-width: 24ch;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: right;
  font-size: 12.5px;
  color: var(--ink);
}
.bar-label .sub { margin-left: 7px; font-size: 11px; color: var(--ink-3); }
.bar-track { display: flex; height: 13px; border-radius: 3px; background: var(--raised); overflow: hidden; }
.bar-track .seg { height: 100%; }
.bar-track .seg + .seg { box-shadow: -1px 0 0 var(--surface); }
.bar-value { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.s-you { fill: var(--c-you); background: var(--c-you); }
.s-agent { fill: var(--c-agent); background: var(--c-agent); }
.s-main { fill: var(--c-main); background: var(--c-main); }
.s-reviews { fill: var(--c-reviews); background: var(--c-reviews); }
.s-other { fill: var(--c-other); background: var(--c-other); }
.key.shade { background: var(--raised); border: 1px solid var(--rule-strong); }

.viz .heat.h0 { fill: var(--raised); opacity: 0.5; }
.viz .heat.h1, .heat-key.h1 { fill: var(--c-heat); background: var(--c-heat); opacity: 0.22; }
.viz .heat.h2, .heat-key.h2 { fill: var(--c-heat); background: var(--c-heat); opacity: 0.42; }
.viz .heat.h3, .heat-key.h3 { fill: var(--c-heat); background: var(--c-heat); opacity: 0.62; }
.viz .heat.h4, .heat-key.h4 { fill: var(--c-heat); background: var(--c-heat); opacity: 0.82; }
.viz .heat.h5, .heat-key.h5 { fill: var(--c-heat); background: var(--c-heat); opacity: 1; }
.heat-key.h0 { background: var(--raised); }

.legend, .heat-scale { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 10px 0 0; padding: 0; list-style: none; font: 12px/1.4 var(--font-mono); color: var(--ink-2); }
.legend li { display: inline-flex; align-items: center; gap: 7px; max-width: none; }
.key { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.heat-scale { align-items: center; gap: 4px; }
.heat-scale span { margin: 0 6px; }
.heat-key { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }

/* ===================================================================
   Verdict
   =================================================================== */
.verdict {
  position: relative;
  margin: 8px 0 24px;
  padding: 30px 34px 26px;
  background: linear-gradient(135deg, var(--green-soft), transparent 60%), var(--surface);
  border: 1px solid var(--rule);
  border-radius: 14px;
  box-shadow: var(--shadow);
}
.verdict .persona {
  margin: 0 0 6px;
  font: 12.5px/1.3 var(--font-mono);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--green);
}
.verdict .line {
  max-width: 30ch;
  margin: 0 0 16px;
  font: italic 500 clamp(1.6rem, 2.8vw, 2.2rem)/1.2 var(--font-prose);
  color: var(--ink-strong);
}
.verdict p:last-child { margin-bottom: 0; }

.traits { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 18px; padding: 0; list-style: none; }
.traits li {
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--raised);
  border: 1px solid var(--rule);
  font: 12.5px/1.4 var(--font-mono);
  color: var(--ink-2);
}

/* ===================================================================
   Findings: what works, what does not
   =================================================================== */
.findings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 0 0 18px; }
.finding {
  --tone: var(--green);
  --tone-soft: var(--green-soft);
  position: relative;
  padding: 18px 20px 16px 22px;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.finding::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--tone); }
.finding.friction { --tone: var(--orange); --tone-soft: var(--orange-soft); }
.finding.risk { --tone: var(--red); --tone-soft: var(--red-soft); }
.finding.note { --tone: var(--blue); --tone-soft: var(--blue-soft); }
.finding .kind {
  display: inline-block;
  margin: 0 0 8px;
  padding: 2px 8px;
  border-radius: 5px;
  background: var(--tone-soft);
  color: var(--tone);
  font: 11.5px/1.5 var(--font-mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.finding h3 { margin: 0 0 8px; font-size: 1.14rem; }
.finding p { font-size: 1rem; margin-bottom: 10px; }
.finding .metric { font: 600 1.35rem/1.2 var(--font-mono); color: var(--tone); margin: 2px 0 8px; }
.finding .metric small { font: 12px/1.3 var(--font-mono); color: var(--ink-3); font-weight: 400; margin-left: 6px; }
.finding.wide { grid-column: 1 / -1; }

main p.evidence { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 0; font: 11.5px/1.4 var(--font-mono); color: var(--ink-3); }
.evidence::before { content: "evidence"; letter-spacing: 0.12em; text-transform: uppercase; margin-right: 4px; }

/* Session refs, filled in from the body's ref markers */
.ref {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 1px 7px 1px 6px;
  border-radius: 6px;
  background: var(--raised);
  border: 1px solid var(--rule);
  color: var(--ink-2);
  font: 11.5px/1.5 var(--font-mono);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  cursor: pointer;
  vertical-align: 0.08em;
}
.ref::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--aqua); opacity: 0.85; }
.ref:hover, .ref:focus-visible { color: var(--ink-strong); border-color: var(--ink-3); }
.ref.copied { border-color: var(--green); color: var(--green); }

.refcard {
  position: fixed;
  z-index: 20;
  width: min(380px, calc(100vw - 24px));
  padding: 14px 16px 12px;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--rule-strong);
  border-radius: 10px;
  box-shadow: 0 18px 40px -14px rgba(0, 0, 0, 0.55);
  font: 12.5px/1.5 var(--font-mono);
  pointer-events: none;
}
.refcard[hidden] { display: none; }
.refcard .rc-ref { color: var(--aqua); font-weight: 600; }
.refcard .rc-name { color: var(--ink-strong); font: 600 15px/1.35 var(--font-prose); margin: 4px 0 6px; }
.refcard .rc-meta { color: var(--ink-2); }
.refcard .rc-prompt { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--rule); color: var(--ink-2); font: 13.5px/1.45 var(--font-prose); }
.refcard .rc-hint { margin-top: 8px; color: var(--ink-3); font-size: 11px; }

/* An earlier report's recommendation: a page glyph instead of the session dot */
.ref.report { color: var(--ink); }
.ref.report::before { width: 7px; height: 9px; border-radius: 1.5px; background: transparent; border: 1.5px solid var(--yellow); opacity: 1; }

/* Since the last report: earlier recommendations, quoted, and what came of them */
.carried-set + .carried-set { margin-top: 30px; }
main p.carried-from {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  max-width: none;
  margin: 0 0 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--rule);
  font: 12px/1.5 var(--font-mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.carried-from span:first-child { color: var(--ink); }
.carried-from span:first-child::before {
  content: "";
  display: inline-block;
  width: 7px;
  height: 9px;
  margin-right: 9px;
  border: 1.5px solid var(--yellow);
  border-radius: 1.5px;
}
.carried { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 0 0 18px; }
.carry {
  --tone: var(--ink-3);
  --tone-soft: var(--raised);
  position: relative;
  padding: 18px 20px 16px 22px;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  scroll-margin-top: 24px;
}
.carry::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--tone); }
.carry[data-outcome="adopted"] { --tone: var(--green); --tone-soft: var(--green-soft); }
.carry[data-outcome="partly"] { --tone: var(--blue); --tone-soft: var(--blue-soft); }
.carry[data-outcome="not-adopted"] { --tone: var(--orange); --tone-soft: var(--orange-soft); }
.carry[data-outcome="superseded"] { --tone: var(--aqua); --tone-soft: var(--aqua-soft); }
.carry:target { border-color: var(--tone); box-shadow: 0 0 0 3px var(--tone-soft), var(--shadow); }
main p.carry-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  max-width: none;
  margin: 0 0 8px;
  font: 11.5px/1.5 var(--font-mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.carry-outcome { padding: 2px 8px; border-radius: 5px; background: var(--tone-soft); color: var(--tone); white-space: nowrap; }
.carry h3 { margin: 0 0 6px; font-size: 1.1rem; }
.carry p { font-size: 1rem; }
main p.carry-original { margin: 0 0 12px; padding-left: 12px; border-left: 2px solid var(--rule-strong); font-style: italic; font-size: 0.98rem; color: var(--ink-2); }
main p.carry-effect { font: 600 0.9rem/1.45 var(--font-mono); color: var(--tone); }
.carried-empty { color: var(--ink-2); }

/* In the user's own words */
.voice {
  position: relative;
  margin: 20px 0 22px;
  padding: 4px 0 4px 26px;
  border-left: 2px solid var(--purple);
  max-width: 62ch;
}
.voice p { font: italic 1.12rem/1.55 var(--font-prose); color: var(--ink-strong); margin: 0 0 8px; }
.voice cite { font: normal 12px/1.4 var(--font-mono); color: var(--ink-3); }
.voice cite::before { content: "you, "; }

/* ===================================================================
   Recommendations
   =================================================================== */
.recs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; counter-reset: rec; margin: 0 0 18px; }
.rec {
  counter-increment: rec;
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 20px 20px 16px;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.rec::before {
  content: "win " counter(rec, decimal-leading-zero);
  font: 11.5px/1 var(--font-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--yellow);
  margin: 0 0 10px;
}
.rec h3 { margin: 0 0 8px; font-size: 1.14rem; }
.rec p { font-size: 1rem; margin-bottom: 10px; }
.rec .change {
  margin: 4px 0 12px;
  padding: 10px 12px;
  background: var(--sunken);
  border: 1px solid var(--rule);
  border-radius: 7px;
  font: 12.5px/1.55 var(--font-mono);
  color: var(--ink);
  white-space: pre-wrap;
}
.rec .change::before { content: "change  "; color: var(--yellow); letter-spacing: 0.08em; }
main p.meters { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: auto 0 0; padding: 10px 0 0; border-top: 1px dashed var(--rule); font: 11.5px/1.4 var(--font-mono); color: var(--ink-3); letter-spacing: 0.06em; }
.rec p.evidence { margin-bottom: 12px; }
.meters span[data-level]::after { margin-left: 7px; letter-spacing: 2px; color: var(--yellow); }
.meters span[data-level="1"]::after { content: "●○○"; }
.meters span[data-level="2"]::after { content: "●●○"; }
.meters span[data-level="3"]::after { content: "●●●"; }

.bets { display: flex; flex-direction: column; gap: 14px; counter-reset: bet; margin: 0 0 18px; }
.bet {
  counter-increment: bet;
  display: grid;
  grid-template-columns: 84px minmax(0, 1fr);
  gap: 4px 22px;
  padding: 24px 26px 20px 20px;
  background: linear-gradient(120deg, var(--blue-soft), transparent 55%), var(--surface);
  border: 1px solid var(--rule);
  border-radius: 14px;
  box-shadow: var(--shadow);
}
.bet::before {
  content: counter(bet, upper-roman);
  grid-row: 1 / span 4;
  font: italic 600 3rem/1 var(--font-prose);
  color: var(--blue);
  text-align: right;
  opacity: 0.9;
}
/* Every child goes in the text column, however many the card has: auto-placed,
   a fifth one would land under the numeral. */
.bet > * { grid-column: 2; min-width: 0; }
.bet h3 { margin: 0 0 6px; font-size: 1.32rem; }
.bet p { font-size: 1.02rem; }
.bet .how { margin: 2px 0 10px; padding-left: 18px; font-size: 1rem; }
.bet .how li { margin: 0 0 4px; }

/* From the community: what others built, each with a verdict ring.
   Rings are cool or neutral; only "why it might not" is a caution. */
.radar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 0 0 18px; }
.find {
  --ring: var(--blue);
  --ring-soft: var(--blue-soft);
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 18px 20px 18px;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.find[data-ring="try"] { --ring: var(--green); --ring-soft: var(--green-soft); }
.find[data-ring="watch"] { --ring: var(--aqua); --ring-soft: var(--aqua-soft); }
.find[data-ring="pass"] { --ring: var(--ink-3); --ring-soft: var(--raised); }
.find::before {
  content: "worth a look";
  align-self: flex-start;
  padding: 2px 8px;
  border-radius: 5px;
  background: var(--ring-soft);
  color: var(--ring);
  font: 11.5px/1.5 var(--font-mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.find[data-ring="try"]::before { content: "try now"; }
.find[data-ring="watch"]::before { content: "keep an eye on"; }
.find[data-ring="pass"]::before { content: "pass for now"; }
.find h3 { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 14px; margin: 0; font-size: 1.14rem; }
.find h3 a { color: var(--ink-strong); text-decoration: none; border-bottom: 1px solid var(--rule-strong); }
.find h3 a:hover { color: var(--blue); border-bottom-color: var(--blue); }
.find .pop { font: 400 12px/1.4 var(--font-mono); color: var(--ink-3); white-space: nowrap; }
.find p { margin: 0; font-size: 1rem; }
.find .fit::before, .find .nofit::before {
  display: block;
  margin-bottom: 2px;
  font: 11px/1.6 var(--font-mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.find .fit::before { content: "why it fits you"; color: var(--green); }
.find .nofit::before { content: "why it might not"; color: var(--orange); }

/* ===================================================================
   Tables, timeline, method
   =================================================================== */
.table-wrap { overflow-x: auto; margin: 0 0 20px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
th {
  text-align: left;
  padding: 11px 14px;
  font: 11.5px/1.3 var(--font-mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
  border-bottom: 1px solid var(--rule-strong);
  font-weight: 500;
}
td { padding: 10px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-size: 0.86em; font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr:hover td { background: var(--raised); }

.timeline { list-style: none; margin: 0 0 22px; padding: 0; border-left: 2px solid var(--rule-strong); }
.timeline li { position: relative; padding: 0 0 18px 24px; }
.timeline li::before { content: ""; position: absolute; left: -7px; top: 8px; width: 12px; height: 12px; border-radius: 50%; background: var(--page); border: 2px solid var(--aqua); }
.timeline time { display: block; font: 12px/1.4 var(--font-mono); letter-spacing: 0.08em; color: var(--aqua); text-transform: uppercase; }
.timeline p { margin: 2px 0 0; font-size: 1rem; }

.method {
  margin: 8px 0 20px;
  padding: 0;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
}
.method summary {
  cursor: pointer;
  padding: 14px 18px;
  font: 12.5px/1.4 var(--font-mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-2);
  list-style: none;
}
.method summary::before { content: "+"; display: inline-block; width: 18px; color: var(--green); }
.method[open] summary::before { content: "-"; }
.method > div { padding: 0 18px 8px 36px; font-size: 1rem; }
.method dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0 0 14px; }
.method dt { font: 12px/1.6 var(--font-mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; }
.method dd { margin: 0; }

.colophon {
  margin-top: 56px;
  padding: 22px 0 0;
  border-top: 1px solid var(--rule);
  display: flex;
  flex-wrap: wrap;
  gap: 8px 22px;
  font: 12px/1.6 var(--font-mono);
  color: var(--ink-3);
}
.colophon strong { color: var(--ink-2); font-weight: 500; }

/* ===================================================================
   Narrow screens: the rail becomes a top bar
   =================================================================== */
@media (max-width: 1080px) {
  .frame { grid-template-columns: 1fr; }
  .rail {
    position: sticky;
    z-index: 5;
    height: auto;
    flex-direction: row;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    border-right: 0;
    border-bottom: 1px solid var(--rule);
    background: var(--page);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .rail::-webkit-scrollbar { display: none; }
  .theme-toggle { flex-shrink: 0; padding: 7px; }
  .theme-toggle .label { display: none; }
  .brand span:last-child, .rail-note { display: none; }
  .toc { flex-direction: row; gap: 0; }
  .toc a { grid-template-columns: auto auto; gap: 6px; margin: 0; white-space: nowrap; border-left: 0; border-bottom: 2px solid transparent; border-radius: 6px 6px 0 0; }
  .toc a[aria-current="true"] { border-bottom-color: var(--green); }
  .rail-foot { margin: 0 0 0 auto; }
  .hero { padding-top: 48px; }
}
@media (max-width: 760px) {
  body { font-size: 17px; }
  main .kicker { letter-spacing: 0.08em; font-size: 11.5px; }
  .kicker span + span::before { margin: 0 8px; }
  .findings, .recs, .radar, .carried, .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .bet { grid-template-columns: 1fr; }
  .bet > * { grid-column: 1; }
  .bet::before { grid-row: auto; text-align: left; font-size: 2rem; }
  .verdict { padding: 22px; }
}

/* ===================================================================
   Print: light palette, no rail, cards kept whole
   =================================================================== */
@media print {
  :root, :root[data-theme] {
    --page: #ffffff; --surface: #ffffff; --raised: #f3efe3; --sunken: #f6f2e6; --rule: #d9d1bb; --rule-strong: #b9ae93;
    --ink-strong: #000000; --ink: #1d2427; --ink-2: #3a454a; --ink-3: #56625c;
    --green: #4f6500; --aqua: #146a4a; --blue: #1b6488; --yellow: #7c5c00; --orange: #a14708; --red: #b42a2c; --purple: #953679;
    --c-you: #b2418e; --c-agent: #2f86a3; --c-main: #6c8a00; --c-reviews: #6660b8; --c-other: #7d8a83; --c-heat: #4f7a00;
    --shadow: none; --glow: none;
  }
  body { font-size: 11pt; }
  .frame { display: block; }
  .rail, .skip, .refcard, .topo-wrap { display: none !important; }
  main { padding: 0; }
  main section { break-before: page; padding-top: 0; border-top: 0; }
  main section:first-of-type { break-before: auto; }
  .chart, .finding, .rec, .bet, .find, .carry, .verdict, .kpi, .voice { break-inside: avoid; }
  .method > div { display: block !important; }
  a { color: inherit; text-decoration: none; }
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the report</a>
<div class="frame">
  <aside class="rail" aria-label="Sections">
    <div class="brand"><span class="brand-mark" aria-hidden="true">π</span><span>field notes</span></div>
    <nav class="toc"><!--slot:nav--></nav>
    <div class="rail-foot">
      <button class="theme-toggle" type="button">
        <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Zm0 1.5v10a5 5 0 0 1 0-10Z"/></svg>
        <span class="label">theme</span>
      </button>
      <p class="rail-note">Hover a ref for details. Click a session ref to copy a <code>piss show</code> command, or an earlier report's ref to jump to that recommendation.</p>
    </div>
  </aside>
  <main id="main">
    <div class="column">
<!--slot:body-->
      <footer class="colophon"><!--slot:footer--></footer>
    </div>
  </main>
</div>
<div class="refcard" role="tooltip" hidden></div>
<script type="application/json" id="ref-data"><!--slot:refs--></script>
<script>
(function () {
  var root = document.documentElement;

  var toggle = document.querySelector(".theme-toggle");
  function syncToggle() {
    var next = root.dataset.theme === "dark" ? "light" : "dark";
    toggle.querySelector(".label").textContent = next + " theme";
    toggle.setAttribute("aria-label", "Switch to the " + next + " theme");
  }
  toggle.addEventListener("click", function () {
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
    localStorage.setItem("pi-report-theme", root.dataset.theme);
    syncToggle();
  });
  syncToggle();

  // Mark the section being read in the rail.
  var links = {};
  document.querySelectorAll(".toc a").forEach(function (a) { links[a.hash.slice(1)] = a; });
  if ("IntersectionObserver" in window) {
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting || !links[e.target.id]) return;
        Object.keys(links).forEach(function (k) { links[k].removeAttribute("aria-current"); });
        links[e.target.id].setAttribute("aria-current", "true");
      });
    }, { rootMargin: "-30% 0px -62% 0px" });
    document.querySelectorAll("main section[id]").forEach(function (s) { observer.observe(s); });
  }

  // Session refs: a details card on hover or focus, copy on click.
  var data = {};
  try { data = JSON.parse(document.getElementById("ref-data").textContent || "{}"); } catch (e) { data = {}; }
  var card = document.querySelector(".refcard");
  function line(cls, text) {
    var d = document.createElement("div");
    d.className = cls;
    d.textContent = text;
    return d;
  }
  function show(el) {
    var d = data[el.dataset.ref];
    if (!d) return;
    card.replaceChildren(
      line("rc-ref", d.ref || el.dataset.ref),
      line("rc-name", d.name || d.title || "unnamed session"),
      line("rc-meta", d.meta || ""),
      line("rc-prompt", d.prompt || ""),
      line("rc-hint", d.hint || "click to copy: piss show " + el.dataset.ref)
    );
    card.hidden = false;
    var r = el.getBoundingClientRect();
    var top = r.bottom + 8;
    if (top + card.offsetHeight > innerHeight - 8) top = r.top - card.offsetHeight - 8;
    card.style.top = Math.max(8, top) + "px";
    card.style.left = Math.min(Math.max(8, r.left), innerWidth - card.offsetWidth - 8) + "px";
  }
  function hide() { card.hidden = true; }
  document.addEventListener("mouseover", function (e) { var el = e.target.closest(".ref"); if (el) show(el); });
  document.addEventListener("mouseout", function (e) { if (e.target.closest(".ref")) hide(); });
  document.addEventListener("focusin", function (e) { var el = e.target.closest(".ref"); if (el) show(el); });
  document.addEventListener("focusout", function (e) { if (e.target.closest(".ref")) hide(); });
  document.addEventListener("scroll", hide, { passive: true });
  document.addEventListener("click", function (e) {
    var el = e.target.closest(".ref");
    if (el && el.dataset.anchor) {
      hide();
      location.hash = el.dataset.anchor;
      return;
    }
    if (!el || !navigator.clipboard) return;
    navigator.clipboard.writeText("piss show " + el.dataset.ref).then(function () {
      el.classList.add("copied");
      setTimeout(function () { el.classList.remove("copied"); }, 900);
    });
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") hide();
    var el = e.target.closest && e.target.closest(".ref");
    if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); el.click(); }
  });
})();
</script>
</body>
</html>
